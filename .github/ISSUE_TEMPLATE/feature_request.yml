name: Feature request
description: Propose a module, an export, a change or a tooling improvement (not for bugs)
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        This package exists so a fix lands **once** instead of in every service.
        Requests must be plumbing or pure code: no business logic, no framework
        coupling, no hidden I/O. For bugs, please use the bug report template.

  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - New feature
        - Change to existing behavior
        - Refactor or cleanup
        - Chore (maintenance, dependencies)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What area does this request affect?
      options:
        - New module
        - New export on an existing module
        - Tooling (lint, test, format, build)
        - CI or release
        - Docs
        - Process
        - Other
    validations:
      required: true

  - type: input
    id: consumer
    attributes:
      label: Consuming repository
      description: The first consumer justifies the request. Separate multiple repositories with commas.
      placeholder: 'sca-users'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is being duplicated or reinvented today?
    validations:
      required: true

  - type: textarea
    id: existing-code
    attributes:
      label: Existing implementations
      description: Links to the code that is duplicated today (permalinks to files or PRs).
      placeholder: |
        - https://github.com/<org>/<repo>/blob/<sha>/src/utils/example.ts
        - https://github.com/<org>/<repo>/blob/<sha>/src/helpers/example.ts

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed surface
      description: Sketch the signature or the config change. Keep it pure. Leave empty for non-code requests.
      render: typescript
      placeholder: 'export function example(input: string): string;'

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change?
      description: Would this change the behavior or signature of anything already exported?
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: New runtime dependencies
      description: List any package this would add to `dependencies` or `peerDependencies`. Write "none" if there are none.
      placeholder: 'none'

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Did you consider keeping this in the consuming service, or using an existing dependency?

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How will we know this is complete?
      placeholder: 'Exported from src/<name>.ts, subpath added to `exports`, covered by test/<name>.test.ts'

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to open the PR?
      options:
        - 'Yes'
        - Yes, with guidance
        - 'No'

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is plumbing or pure code, not business logic
          required: true
        - label: Content is in English
          required: true
