---
name: Validate

# Repository-hygiene checks for this repo via the org shared template
# (CI-CD-Templates/.github/workflows/shared-validate.yml, SHA-pinned): markdown
# lint + link check, yamllint + shell syntax, and actionlint over the
# workflows. The globs and config paths below match this repository's layout
# (no docs/ directory; shell scripts live in scripts/).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No top-level `concurrency` group: each called workflow declares its own, and a
# caller reusing the same group makes the call fail at dispatch with zero jobs.

jobs:
  validate:
    name: Validate
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-validate.yml@684819efa838ed7f653723f9f58ed18c48697b37 # v3.5.0
    with:
      markdown: true
      markdown-glob: '**/*.md'
      markdown-links: true
      markdown-link-config: .github/markdown-link-check.json
      markdown-link-paths: 'README.md AGENTS.md .github'
      yaml: true
      yaml-config: .yamllint.yaml
      yaml-requirements: .github/requirements-yamllint.txt
      shell-glob: scripts/*.sh
      actionlint: true
