---
name: Release

on:
  push:
    branches: [main]

# The ceiling for the called workflow. It mints its own GitHub App token for the
# release work, but `shared-release-flow.yml` also declares an `auto-merge` job
# with `pull-requests: write`, and GitHub validates the permissions of every job
# in a called workflow against the caller's grants when it builds the run graph.
# That job is gated behind auto-merge-release-pr=false, yet omitting the grant
# fails the entire run at startup (conclusion: startup_failure, zero check runs).
permissions:
  contents: read
  pull-requests: write

# No `concurrency` group: `shared-release-flow.yml` declares its own
# (`release-${{ github.ref }}`) and must never be cancelled by a re-run.

jobs:
  release:
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-release-flow.yml@e203b26bdc2a05e91715dd411faf9f6a9181a25b # v3.4.0
    with:
      release-type: node
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
