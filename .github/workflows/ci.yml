---
name: CI

on:
  push:
    branches: [main]
  pull_request:

# This is the ceiling for every called workflow: a reusable workflow can never
# exceed what its caller grants. GitHub validates the declared permissions of
# *every* job in a called workflow against this ceiling while it builds the run
# graph, so a missing entry does not fail one job, it kills the whole run before
# any job is created (conclusion: startup_failure, zero check runs).
#   security-events: write  -> gitleaks and CodeQL upload SARIF
#   pull-requests: read     -> the release gate lists open pull requests
#   actions: read           -> CodeQL
#   packages: write         -> stack-node-ts.yml's `publish` job declares it.
#                              That job is gated behind run-publish=false, but
#                              the grant is still mandatory because validation
#                              is static. This repo never publishes an image, so
#                              the grant is pure collateral; see the note in
#                              CI-CD-Templates/docs/usage.md.
permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write
  packages: write

# No top-level `concurrency` group on purpose. Each called workflow declares its
# own (`security-…`, `stack-node-ts-…`); a caller reusing the same group makes
# the call fail at dispatch with zero jobs and no log.

jobs:
  # Job name matters: the reusable workflow's job is also called `release-gate`,
  # and the check context GitHub records is "<caller job> / <called job>". Naming
  # the caller `release-gate` is what produces the `release-gate / release-gate`
  # context that the branch ruleset requires.
  release-gate:
    if: github.event_name == 'pull_request'
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-qa-lock-check.yml@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0

  security:
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-security-scan.yml@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0

  codeql:
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-codeql.yml@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
    with:
      languages: '["javascript-typescript"]'

  stack:
    uses: sca-templates/CI-CD-Templates/.github/workflows/stack-node-ts.yml@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
    with:
      node-version: '22'
      package-manager: pnpm
      pnpm-version: '10.18.0'
      run-lint: true
      run-format: true
      run-test: true
      run-build: true
